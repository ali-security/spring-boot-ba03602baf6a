name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task and --tests selectors to run instead of the scoped build (empty = scoped build)'
        required: false
        default: ''
jobs:
  ci:
    name: '${{ matrix.os.name}} | Java ${{ matrix.java.version}}'
    runs-on: ${{ matrix.os.id }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
            name: Linux
          - id: windows-latest
            name: Windows
        java:
          - version: 17
            toolchain: false
          - version: 21
            toolchain: true
          - version: 22
            toolchain: true
          - version: 23
            toolchain: true
        exclude:
          - os:
              name: Linux
            java:
              version: 17
          - os:
              name: ${{ github.repository == 'spring-projects/spring-boot-commercial' && 'Windows' }}
    steps:
      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          commercial-release-repository-url: ${{ vars.COMMERCIAL_RELEASE_REPO_URL }}
          commercial-repository-password: ${{ secrets.COMMERCIAL_ARTIFACTORY_RO_PASSWORD }}
          commercial-repository-username: ${{ secrets.COMMERCIAL_ARTIFACTORY_RO_USERNAME }}
          commercial-snapshot-repository-url: ${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          gradle-cache-read-only: false
          java-early-access: ${{ matrix.java.early-access || 'false' }}
          java-distribution: ${{ matrix.java.distribution }}
          java-toolchain: ${{ matrix.java.toolchain }}
          java-version: ${{ matrix.java.version }}
          build-tasks: ${{ inputs.test-filter != '' && format(':spring-boot-project:spring-boot:assemble {0}', inputs.test-filter) || ':spring-boot-project:spring-boot:build :spring-boot-project:spring-boot-actuator-autoconfigure:test --tests org.springframework.boot.actuate.autoconfigure.security.reactive.EndpointRequestTests --tests org.springframework.boot.actuate.autoconfigure.security.servlet.EndpointRequestTests' }}
