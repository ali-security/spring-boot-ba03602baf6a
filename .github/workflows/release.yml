name: Release
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task and --tests selectors to run instead of the module build (empty = module build)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-stage-release:
    name: Build and Stage Release
    runs-on: ${{ vars.UBUNTU_MEDIUIM || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build and Publish
        id: build-and-publish
        uses: ./.github/actions/build
        with:
          commercial-release-repository-url: ${{ vars.COMMERCIAL_RELEASE_REPO_URL }}
          commercial-repository-password: ${{ secrets.COMMERCIAL_ARTIFACTORY_RO_PASSWORD }}
          commercial-repository-username: ${{ secrets.COMMERCIAL_ARTIFACTORY_RO_USERNAME }}
          commercial-snapshot-repository-url: ${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          gradle-cache-read-only: false
          publish: true
          build-tasks: ${{ inputs.test-filter != '' && format(':spring-boot-project:spring-boot:assemble {0}', inputs.test-filter) || ':spring-boot-project:spring-boot:build' }}
          publish-tasks: ':spring-boot-project:spring-boot:publishAllPublicationsToDeploymentRepository'
      - name: Upload Release Jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: |
            deployment-repository/org/springframework/boot/spring-boot/*/spring-boot-*.jar
            !deployment-repository/**/*-sources.jar
            !deployment-repository/**/*-javadoc.jar
          if-no-files-found: error
    outputs:
      version: ${{ steps.build-and-publish.outputs.version }}
